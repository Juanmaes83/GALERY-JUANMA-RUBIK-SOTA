name: museum-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Studio layout and save/apply
        run: npm run test:studio-layout
      - name: whitespace (árbol completo; ver .gitattributes)
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
